  padding: 20px;
}

h1 {
  color: #ff4d4d;
}

.card {
  background: #111;

  border-radius: 12px;
  min-height: 120px;
  display: flex;

  justify-content: center;
  font-size: 20px;

button {
  padding: 12px 20px;

  color: white;
}

.switch-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.switch {
  position: relative;
  width: 50px;
  height: 26px;
}

.switch input {
  opacity: 0;
}

.slider {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #555;
  border-radius: 26px;
  transition: .4s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  border-radius: 50%;
  transition: .4s;
}

input:checked + .slider {
  background-color: #ff4d4d;
}

input:checked + .slider:before {
  transform: translateX(24px);
}
</style>
